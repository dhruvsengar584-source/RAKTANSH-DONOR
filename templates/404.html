{% extends "base.html" %}

{% block title %}404 - Page Not Found | RaktSetu{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-16rem)] flex items-center justify-center py-16 px-4">
  <div class="max-w-md w-full text-center">
    
    <!-- Animated Blood Drop Illustration -->
    <div class="relative w-32 h-32 mx-auto mb-6">
      <div class="w-24 h-24 rounded-full bg-rose-500/20 absolute inset-0 m-auto blur-xl animate-pulse"></div>
      
      <!-- Drop SVG -->
      <svg class="w-28 h-28 mx-auto text-rose-600 relative z-10 drop-shadow-xl" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
        <!-- Sad eyes/face inside drop for 404 -->
        <circle cx="9.5" cy="14" r="1.2" fill="#FFFFFF" />
        <circle cx="14.5" cy="14" r="1.2" fill="#FFFFFF" />
        <path d="M9.5 18c1-1 3.5-1 4.5 0" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none" />
      </svg>
      
      <span class="absolute -bottom-2 -right-2 px-2.5 py-1 rounded-full bg-slate-900 text-white font-mono font-extrabold text-xs shadow-md border border-slate-700">
        404
      </span>
    </div>

    <h1 class="text-3xl font-extrabold font-heading text-slate-900 dark:text-white mb-2">Lost in Transfusion?</h1>
    <p class="text-xs text-slate-500 dark:text-slate-400 mb-8 max-w-sm mx-auto leading-relaxed">
      We couldn't locate the page you're searching for. The donor or emergency record may have moved or been updated.
    </p>

    <div class="flex items-center justify-center gap-3">
      <a href="{{ url_for('index') }}" class="px-5 py-3 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-lg shadow-rose-600/30 transition-all flex items-center gap-2">
        <i data-lucide="home" class="w-4 h-4"></i>
        <span>Return Home</span>
      </a>
      <a href="{{ url_for('search') }}" class="px-5 py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold text-xs hover:bg-slate-200 transition-colors flex items-center gap-2">
        <i data-lucide="search" class="w-4 h-4"></i>
        <span>Search Donors</span>
      </a>
    </div>

  </div>
</div>
{% endblock %}
